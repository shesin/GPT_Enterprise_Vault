<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBeads Web Playtest</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #143328;
      color: #ebe2cf;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 10px;
      font-weight: 600;
    }
    .panel {
      background: #1f4d39;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      margin-bottom: 20px;
      text-align: center;
      max-width: 620px;
      width: 100%;
      border: 1px solid rgba(201,162,39,0.25);
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button, select {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #8a7a62;
      background-color: #c9a227;
      color: #143328;
      cursor: pointer;
    }
    button:disabled {
      background-color: #6b6355;
      cursor: not-allowed;
    }
    button.secondary {
      background-color: #8a7a62;
      color: #fff;
    }
    .status-row {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 8px;
    }
    .banner {
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
    }
    .banner.game-over {
      background-color: rgba(212, 237, 218, 0.15);
      color: #ebe2cf;
      border: 1px solid rgba(201,162,39,0.45);
    }
    svg#board {
      background: linear-gradient(145deg, #1f4d39, #143328);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      cursor: pointer;
      border: 1px solid rgba(201,162,39,0.2);
    }
    .instruction {
      margin-top: 10px;
      font-size: 14px;
      color: #c9d4c9;
    }
    label {
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h1 id="boardTitle">SmartBeads — 16-bead · 5×5 Classic</h1>

  <div class="panel">
    <div class="controls">
      <label for="boardSelect"><strong>Board:</strong></label>
      <select id="boardSelect"></select>

      <label for="colorSelect"><strong>Your Color:</strong></label>
      <select id="colorSelect">
        <option value="RED" selected>RED (Moves First)</option>
        <option value="BLUE">BLUE (Moves Second)</option>
      </select>
      <button id="restartBtn">New Game</button>
    </div>

    <div class="status-row">
      <div id="turnStatus">Turn: 1 (RED)</div>
      <div id="pieceStatus">Pieces - RED: 16 | BLUE: 16</div>
      <div id="captureStatus">Captures - RED: 0 | BLUE: 0</div>
    </div>

    <div class="controls">
      <button id="endTurnBtn" class="secondary" disabled>End Turn Voluntarily</button>
    </div>

    <div id="gameBanner" class="banner" style="display: none;"></div>
    <div id="instructionText" class="instruction">Click an owned piece to highlight legal moves, then click a target destination.</div>
  </div>

  <svg id="board" width="560" height="680" viewBox="0 0 560 680"></svg>

  <script type="module" src="/PROJECTS/SmartBeads/src/playtest/web/main.ts"></script>
</body>
</html>
