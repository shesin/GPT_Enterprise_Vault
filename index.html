<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBeads</title>
  <link rel="stylesheet" href="/PROJECTS/SmartBeads/src/playtest/web/play-shell.css">
</head>
<body>
  <div class="shell">
    <aside class="card left">
      <h2>Players</h2>
      <div class="pill red" id="pill-p1">
        <div>
          <div><strong>Ivory (P1)</strong></div>
          <div class="tiny" id="p1-role">(Human)</div>
        </div>
        <div class="timer" id="p1-clock">--:--</div>
      </div>
      <div class="pill blue" id="pill-p2">
        <div>
          <div><strong>Ebony (P2)</strong></div>
          <div class="tiny" id="p2-role">(AI)</div>
        </div>
        <div class="timer" id="p2-clock">--:--</div>
      </div>
      <div class="stat"><span>P1 pieces</span><span class="val" id="p1-pieces">16</span></div>
      <div class="stat"><span>P2 pieces</span><span class="val" id="p2-pieces">16</span></div>
      <div class="stat"><span>P1 captures</span><span class="val" id="p1-caps">0</span></div>
      <div class="stat"><span>P2 captures</span><span class="val" id="p2-caps">0</span></div>
      <div class="stat"><span>Turns</span><span class="val" id="turn-count">0</span></div>
      <div class="stat"><span>Shot clock</span><span class="val" id="shot-clock-val">OFF</span></div>
      <div class="stat"><span>Match timer</span><span class="val" id="match-clock-val">OFF</span></div>
      <div class="stat"><span>P1 center</span><span class="val" id="p1-center">Off</span></div>
      <div class="stat"><span>P2 center</span><span class="val" id="p2-center">Off</span></div>
    </aside>

    <main class="main">
      <div class="board-frame"><canvas id="board" width="500" height="680"></canvas></div>
      <div id="status"></div>
      <div class="controls">
        <button class="finish" id="finish-btn">Finish chain</button>
        <button id="undo-btn" type="button">Undo</button>
        <button id="restart-btn">New game</button>
      </div>
    </main>

    <aside class="card right">
      <h2>Settings</h2>
      <div class="setting-list">
        <div class="setting">
          <label>Board</label>
          <select id="board-select"></select>
        </div>
        <div class="setting">
          <label>Game mode</label>
          <select id="game-mode-select">
            <option value="pve" selected>Human vs AI</option>
            <option value="pvp">Human vs Human</option>
          </select>
        </div>
        <div class="setting" id="ai-level-container">
          <label>AI level</label>
          <select id="ai-level-select">
            <option value="1">Easy</option>
            <option value="2" selected>Medium</option>
            <option value="3">Hard</option>
          </select>
        </div>
        <div class="setting">
          <label>Match timer</label>
          <select id="match-timer-select"></select>
        </div>
        <div class="setting">
          <label>Turn shot clock</label>
          <select id="shot-clock-select"></select>
        </div>
        <div class="setting">
          <label>Center rule</label>
          <select id="center-rule-select"></select>
        </div>
      </div>

      <h2 style="margin-top: 14px;">BGM Music</h2>
      <div class="bgm-section">
        <select id="bgm-select">
          <option value="">— Select Music —</option>
        </select>
        <div class="bgm-controls">
          <button type="button" id="bgm-play">▶ Play</button>
          <button type="button" id="bgm-pause">⏸ Pause</button>
        </div>
        <div class="bgm-vol-row">
          <span class="tiny">Volume</span>
          <input type="range" id="bgm-vol" min="0" max="1" step="0.05" value="0.3">
        </div>
      </div>
      <audio id="bgm-audio" loop></audio>
    </aside>
  </div>

  <div class="modal" id="result-modal">
    <div class="modal-card">
      <h3 id="result-title">Game Over</h3>
      <p id="result-desc"></p>
      <button id="play-again-btn">Play again</button>
    </div>
  </div>

  <script type="module" src="/PROJECTS/SmartBeads/src/playtest/web/main.ts"></script>
</body>
</html>
