name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      # Fast Jest batches (--skip-slow; the slow AI batches take about 20 s and run with `npm run test:jest`).
      # The real-browser gates run in the separate browser-gates job below.
      - run: npm run test:jest:fast

  # Real-browser gates (Chromium, real clicks): two-click captures on all 7 boards plus the
  # flow gate (Undo x clocks / AI, setting-change confirm, resign, phone layout, render loop,
  # blocked storage). Passed 3 of 3 local runs on 2026-10-02; GitHub run 36996520017 (68a03ae) seen green on 2026-10-02.
  browser-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node PROJECTS/SmartBeads/scripts/m2-2step-npm-gate.mjs
